name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-eval:
    name: Service evaluation tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service-eval
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: service-eval/uv.lock

      - name: Install locked workspace
        run: uv sync --locked --dev

      - name: Test
        run: uv run pytest

      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.2"

      - name: Test browser verdict classification
        working-directory: service-eval/browser
        run: deno task test

      - name: Check browser scenario workspace
        working-directory: service-eval/browser
        run: deno task check
