name: Docker - Service Evaluation API

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - contracts/**
      - service-eval/**
      - .github/workflows/docker-service-eval.yml
  workflow_dispatch:

concurrency:
  group: docker-service-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: observer
            image: cfwarp-observer
            smoke: python
          - target: worker
            image: cfwarp-eval-worker
            smoke: python
          - target: browser
            image: cfwarp-eval-browser
            smoke: browser
          - target: full
            image: cfwarp-service-eval
            smoke: python
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: pkg
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME}-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: service-eval/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.pkg.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.pkg.outputs.date }}
          cache-from: type=gha,scope=service-eval-${{ matrix.target }}-amd64
          cache-to: type=gha,mode=max,scope=service-eval-${{ matrix.target }}-amd64

      - name: Smoke the published Python runtime
        if: matrix.smoke == 'python'
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c \
            'import cfwarp_service_eval.api, cfwarp_service_eval.worker, cfwarp_service_eval.reporter'

      - name: Smoke the browser runtime from the published image
        if: matrix.smoke == 'browser'
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --tmpfs /dev/shm:rw,nosuid,nodev,size=256m \
            --env HOME=/tmp \
            --env XDG_CACHE_HOME=/tmp/cache \
            --env XDG_RUNTIME_DIR=/tmp/runtime \
            --entrypoint agent-browser \
            "$IMAGE" \
            --executable-path /usr/local/bin/agent-browser-chrome \
            --session ci-image-smoke \
            --json \
            batch --bail \
            "open about:blank" \
            "eval ({ready: document.readyState, userAgent: navigator.userAgent})" \
            "close"

      # This repository is public, so provenance attestation is supported here
      # even though it is skipped in the private runtime project.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
